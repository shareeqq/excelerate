<head>

  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <style>
/* ============================================================
   Excelerate — Warm design tokens and shared components
   ============================================================ */

:root {
  /* Colour */
  --paper: #fafaf5;
  --panel: #f4f4eb;
  --panel-featured: #ecebe0;
  --ink: #191918;
  --body: #474744;
  --muted: #75756f;
  --brand: #a71d31;
  --brand-strong: #8c1628;
  --hairline: #e3e2d8;
  --hairline-strong: #cfcec2;
  --error: #a71d31;
  --overlay: rgba(25, 25, 24, 0.45);

  /* Shape */
  --radius: 2px;
  --radius-round: 999px;

  /* Space */
  --space-1: 4px;
  --space-2: 8px;
  --space-3: 12px;
  --space-4: 16px;
  --space-5: 24px;
  --space-6: 32px;
  --space-7: 48px;
  --space-8: 64px;
  --space-9: 96px;

  /* Type */
  --font: "Inter", system-ui, -apple-system, "Segoe UI", Arial, sans-serif;
  --text-xs: 12px;
  --text-sm: 14px;
  --text-base: 16px;
  --text-lg: 18px;
  --text-xl: 24px;
  --text-2xl: 30px;
  --text-3xl: 38px;

  /* Layout */
  --maxw: 1280px;
  --tap: 44px;

  /* Floating overlays only */
  --shadow-float: 0 8px 24px rgba(25, 25, 24, 0.12), 0 2px 6px rgba(25, 25, 24, 0.08);
}

*,
*::before,
*::after {
  box-sizing: border-box;
}

html {
  -webkit-text-size-adjust: 100%;
}

body {
  margin: 0;
  background: var(--paper);
  color: var(--body);
  font-family: var(--font);
  font-size: var(--text-base);
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
}

h1,
h2,
h3,
h4 {
  margin: 0;
  color: var(--ink);
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.15;
}

p {
  margin: 0;
}

ul,
ol {
  margin: 0;
  padding: 0;
}

a {
  color: inherit;
}

button,
input,
textarea,
select {
  font: inherit;
  color: inherit;
}

svg {
  display: block;
  flex: none;
}

[hidden] {
  display: none !important;
}

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.skip-link {
  position: fixed;
  top: -100px;
  left: var(--space-4);
  z-index: 400;
  padding: var(--space-2) var(--space-4);
  background: var(--ink);
  color: var(--paper);
  font-size: var(--text-xs);
  letter-spacing: 0.08em;
  text-transform: uppercase;
  text-decoration: none;
  border-radius: var(--radius);
}

.skip-link:focus {
  top: var(--space-3);
}

/* ---------- Type helpers ---------- */

.eyebrow {
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.14em;
  line-height: 1.4;
  text-transform: uppercase;
}

.page-title {
  font-size: var(--text-2xl);
}

.section-title {
  font-size: var(--text-xl);
}

.subsection-title {
  font-size: var(--text-lg);
}

.lede {
  color: var(--body);
  font-size: var(--text-base);
  max-width: 62ch;
}

.muted {
  color: var(--muted);
  font-size: var(--text-sm);
}

.flow > * + * {
  margin-top: var(--space-5);
}

.flow--tight > * + * {
  margin-top: var(--space-4);
}

.bullets {
  list-style: none;
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.bullets li {
  position: relative;
  padding-left: var(--space-4);
}

.bullets li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.7em;
  width: 5px;
  height: 5px;
  background: var(--brand);
  border-radius: var(--radius);
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0 0 0 0);
  white-space: nowrap;
  border: 0;
}

/* ---------- Button ---------- */

.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: var(--space-2);
  min-height: var(--tap);
  padding: 0 var(--space-4);
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  text-transform: uppercase;
  cursor: pointer;
  transition: background-color 120ms ease, border-color 120ms ease, color 120ms ease;
}

.btn--primary {
  background: var(--brand);
  border-color: var(--brand);
  color: var(--paper);
}

.btn--primary:hover {
  background: var(--brand-strong);
  border-color: var(--brand-strong);
}

.btn--primary:active {
  background: var(--brand-strong);
}

.btn--secondary {
  background: var(--paper);
  border-color: var(--hairline);
  color: var(--ink);
}

.btn--secondary:hover {
  background: var(--panel);
  border-color: var(--hairline-strong);
}

.btn--secondary:active {
  background: var(--panel-featured);
}

.btn--ghost {
  background: transparent;
  color: var(--ink);
}

.btn--ghost:hover {
  background: var(--panel);
}

.btn--ghost:active {
  background: var(--panel-featured);
}

.btn:disabled,
.btn[aria-disabled="true"] {
  background: var(--panel);
  border-color: var(--hairline);
  color: var(--muted);
  cursor: not-allowed;
}

.btn--primary:focus-visible {
  outline-color: var(--ink);
}

.btn--block {
  width: 100%;
}

.btn--small {
  min-height: 40px;
  padding: 0 var(--space-3);
  font-size: 10px;
}

/* ---------- Fields ---------- */

.field {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  min-width: 0;
}

.field__label {
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.12em;
  line-height: 1.4;
  text-transform: uppercase;
}

.field__hint,
.field__error {
  font-size: var(--text-sm);
  line-height: 1.4;
}

.field__hint {
  color: var(--muted);
}

.field__error {
  color: var(--error);
}

.input,
.textarea,
.select {
  width: 100%;
  min-height: var(--tap);
  padding: 10px var(--space-3);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: var(--text-base);
  line-height: 1.4;
}

.input::placeholder,
.textarea::placeholder {
  color: var(--muted);
  opacity: 1;
}

.input:hover,
.textarea:hover,
.select:hover {
  border-color: var(--hairline-strong);
}

.input:focus,
.textarea:focus,
.select:focus {
  border-color: var(--brand);
  outline: 2px solid var(--brand);
  outline-offset: 1px;
}

.input:disabled,
.textarea:disabled,
.select:disabled {
  background: var(--panel);
  color: var(--muted);
  cursor: not-allowed;
}

.input[aria-invalid="true"],
.textarea[aria-invalid="true"],
.select[aria-invalid="true"] {
  border-color: var(--error);
}

.textarea {
  min-height: 104px;
  resize: vertical;
}

.select-wrap {
  position: relative;
}

.select {
  appearance: none;
  padding-right: var(--space-7);
  cursor: pointer;
}

.select-wrap::after {
  content: "";
  position: absolute;
  right: var(--space-4);
  top: 50%;
  width: 7px;
  height: 7px;
  border-right: 1.5px solid var(--muted);
  border-bottom: 1.5px solid var(--muted);
  transform: translateY(-70%) rotate(45deg);
  pointer-events: none;
}

/* ---------- Tabs ---------- */

.tabs {
  display: flex;
  gap: var(--space-5);
  border-bottom: 1px solid var(--hairline);
}

.tab {
  appearance: none;
  min-height: var(--tap);
  margin-bottom: -1px;
  padding: var(--space-3) 0;
  border: 0;
  border-bottom: 2px solid transparent;
  background: none;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.1em;
  line-height: 1.2;
  text-transform: uppercase;
  cursor: pointer;
}

.tab:hover {
  color: var(--ink);
}

.tab[aria-selected="true"] {
  border-bottom-color: var(--brand);
  color: var(--ink);
}

.tab:active {
  background: var(--panel);
}

.tab:disabled {
  color: var(--hairline-strong);
  cursor: not-allowed;
}

/* ---------- Card ---------- */

.card {
  padding: var(--space-5);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.card--featured {
  background: var(--panel-featured);
}

.card--plain {
  background: var(--paper);
}

/* ---------- List ---------- */

.list {
  list-style: none;
  border-top: 1px solid var(--hairline);
}

.list-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  min-height: 56px;
  padding: var(--space-3) var(--space-2);
  border-bottom: 1px solid var(--hairline);
  color: inherit;
  text-decoration: none;
}

a.list-row:hover {
  background: var(--panel);
}

.list-row__main {
  flex: 1;
  min-width: 0;
}

.list-row__title {
  display: block;
  color: var(--ink);
  font-weight: 500;
}

.list-row__meta {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: var(--text-sm);
}

.list-row__end {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  color: var(--muted);
  font-size: var(--text-sm);
  white-space: nowrap;
}

.list-row--static:hover {
  background: transparent;
}

/* ---------- Badge ---------- */

.badge {
  display: inline-flex;
  align-items: center;
  gap: var(--space-1);
  padding: 2px var(--space-2);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--body);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  line-height: 1.6;
  text-transform: uppercase;
  white-space: nowrap;
}

.badge--brand {
  border-color: var(--brand);
  color: var(--brand);
}

.badge--solid {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--paper);
}

.badge--panel {
  background: var(--panel);
  color: var(--muted);
}

/* ---------- Filter bar ---------- */

.filter-bar {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.filter-bar .field {
  flex: 1 1 160px;
}

.filter-bar__actions {
  display: flex;
  gap: var(--space-2);
}

/* ---------- Breadcrumb ---------- */

.breadcrumb {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  list-style: none;
  font-size: var(--text-sm);
  color: var(--muted);
}

.breadcrumb li {
  display: flex;
  gap: var(--space-2);
}

.breadcrumb li + li::before {
  content: "/";
  color: var(--hairline-strong);
}

.breadcrumb a {
  color: var(--body);
  text-decoration: none;
}

.breadcrumb a:hover {
  color: var(--ink);
  text-decoration: underline;
}

.breadcrumb [aria-current="page"] {
  color: var(--ink);
}

/* ---------- Empty state ---------- */

.empty {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-6) var(--space-5);
  border: 1px dashed var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--panel);
}

.empty__mark {
  color: var(--muted);
}

.empty__title {
  color: var(--ink);
  font-weight: 500;
}

/* ---------- Modal ---------- */

.modal-layer {
  position: fixed;
  inset: 0;
  z-index: 250;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-4);
}

.modal-layer[hidden] {
  display: none;
}

body.view-mobile .modal-layer {
  position: absolute;
}

body.modal-open {
  overflow: hidden;
}

body.modal-open .app-main {
  overflow: hidden;
}

.modal-backdrop {
  position: absolute;
  inset: 0;
  background: var(--overlay);
}

.modal {
  position: relative;
  width: min(480px, 100%);
  max-height: 100%;
  overflow-y: auto;
}

.modal__panel {
  padding: var(--space-5);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: var(--shadow-float);
}

.modal__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-4);
}

.modal__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-top: var(--space-4);
}

.modal__actions {
  display: flex;
  flex-wrap: wrap;
  justify-content: flex-end;
  gap: var(--space-2);
  margin-top: var(--space-5);
}

/* ---------- Icon button ---------- */

.icon-btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: var(--tap);
  height: var(--tap);
  padding: 0;
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--ink);
  cursor: pointer;
}

.icon-btn:hover {
  background: var(--panel);
}

.icon-btn:active {
  background: var(--panel-featured);
}

/* ============================================================
   Prototype chrome — outside the app
   ============================================================ */

.proto-bar {
  position: sticky;
  top: 0;
  z-index: 200;
  border-bottom: 1px solid var(--hairline);
  background: var(--panel);
}

.proto-bar__inner {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2) var(--space-4);
  max-width: var(--maxw);
  margin: 0 auto;
  padding: var(--space-2) var(--space-4);
}

.proto-bar__label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  line-height: 1.4;
  text-transform: uppercase;
}

.proto-bar__divider {
  width: 1px;
  height: 24px;
  background: var(--hairline-strong);
}

.proto-link {
  display: inline-flex;
  align-items: center;
  min-height: 36px;
  padding: 0 var(--space-2);
  border-radius: var(--radius);
  color: var(--body);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-decoration: none;
  text-transform: uppercase;
}

.proto-link:hover {
  background: var(--panel-featured);
  color: var(--ink);
}

.proto-link[aria-current="page"] {
  color: var(--brand);
}

/* ---------- Segmented control ---------- */

.segmented {
  display: flex;
  gap: 2px;
  padding: 2px;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
}

.segmented__btn {
  min-height: 40px;
  padding: 0 var(--space-3);
  border: 1px solid transparent;
  border-radius: var(--radius);
  background: transparent;
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  line-height: 1.2;
  text-transform: uppercase;
  cursor: pointer;
}

.segmented__btn:hover {
  background: var(--panel);
  color: var(--ink);
}

.segmented__btn[aria-pressed="true"] {
  border-color: var(--hairline);
  background: var(--panel-featured);
  color: var(--ink);
}

.segmented__btn:active {
  background: var(--panel-featured);
}

.segmented__btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* ---------- Switch ---------- */

.switch {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
  min-height: 40px;
  cursor: pointer;
}

.switch input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.switch__track {
  position: relative;
  width: 36px;
  height: 20px;
  flex: none;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-round);
  background: var(--paper);
  transition: background-color 120ms ease, border-color 120ms ease;
}

.switch__thumb {
  position: absolute;
  top: 2px;
  left: 2px;
  width: 14px;
  height: 14px;
  border-radius: var(--radius-round);
  background: var(--muted);
  transition: transform 120ms ease, background-color 120ms ease;
}

.switch input:checked + .switch__track {
  border-color: var(--brand);
  background: var(--brand);
}

.switch input:checked + .switch__track .switch__thumb {
  background: var(--paper);
  transform: translateX(16px);
}

.switch input:focus-visible + .switch__track {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.switch__label {
  color: var(--ink);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  line-height: 1.3;
  text-transform: uppercase;
}

/* ============================================================
   Device frame and app shell
   ============================================================ */

.stage {
  display: flex;
  justify-content: center;
  padding: 0;
}

.device-scaler {
  width: 100%;
}

.device {
  width: 100%;
  background: var(--paper);
}

.app {
  position: relative;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
  background: var(--paper);
}

body.view-mobile .stage {
  padding: var(--space-3);
}

body.view-mobile .device-scaler {
  flex: none;
  width: min(430px, calc(100vw - 24px));
  height: min(900px, calc(100vh - var(--proto-h, 64px) - 24px));
}

body.view-mobile .device {
  width: 100%;
  height: 100%;
  overflow: hidden;
  border: 1px solid var(--hairline);
  border-radius: 36px;
  background: var(--paper);
  box-shadow: var(--shadow-float);
}

body.view-mobile .app {
  height: 100%;
  min-height: 0;
  overflow: hidden;
}

/* ---------- Top bar ---------- */

.topbar {
  flex: none;
  border-bottom: 1px solid var(--hairline);
  background: var(--paper);
}

.topbar__inner {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-4);
  max-width: var(--maxw);
  margin: 0 auto;
  padding: var(--space-3) var(--space-4);
}

.topbar__actions {
  display: flex;
  align-items: center;
  gap: var(--space-2);
}

.wordmark {
  padding: var(--space-1) 0;
  color: var(--ink);
  font-size: 20px;
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1.2;
  text-decoration: none;
}

.bell {
  position: relative;
}

.bell__dot {
  position: absolute;
  top: 9px;
  right: 9px;
  width: 7px;
  height: 7px;
  border-radius: var(--radius-round);
  background: var(--brand);
}

/* ---------- Body, side nav, main ---------- */

.app-body {
  display: flex;
  flex: 1;
  width: 100%;
  max-width: var(--maxw);
  min-height: 0;
  margin: 0 auto;
}

.app-main {
  flex: 1;
  min-width: 0;
  padding: var(--space-5) var(--space-4) var(--space-7);
}

body.view-mobile .app-main {
  overflow-y: auto;
  overscroll-behavior: contain;
}

.sidenav {
  display: none;
}

/* ---------- Bottom tab bar ---------- */

.tabbar {
  display: flex;
  flex: none;
  padding: var(--space-1) var(--space-1) max(var(--space-1), env(safe-area-inset-bottom));
  border-top: 1px solid var(--hairline);
  background: var(--paper);
}

.tabbar__item {
  display: flex;
  flex: 1;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 2px;
  min-height: 54px;
  padding: var(--space-1) 2px;
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.06em;
  line-height: 1.2;
  text-align: center;
  text-decoration: none;
  text-transform: uppercase;
}

.tabbar__item:hover {
  background: var(--panel);
  color: var(--ink);
}

.tabbar__item[aria-current="page"] {
  color: var(--brand);
}

.tabbar__item svg {
  width: 20px;
  height: 20px;
}

/* ============================================================
   Screens
   ============================================================ */

.screen {
  max-width: 920px;
}

.screen--wide {
  max-width: 100%;
}

.page-head {
  display: flex;
  flex-direction: column;
}

.page-head .page-title {
  margin-top: var(--space-2);
}

.page-head .lede {
  margin-top: var(--space-5);
}

.page-head--row {
  gap: var(--space-4);
}

.hero-card {
  padding: var(--space-6) var(--space-5);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel-featured);
}

/* ---------- Phase 1: student core loop ---------- */

.section-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2) var(--space-4);
}

.home-grid,
.home-split {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-4);
}

.subject-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  color: inherit;
  text-decoration: none;
}

a.subject-card:hover {
  border-color: var(--hairline-strong);
  background: var(--panel-featured);
}

.subject-card__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.subject-card__title {
  color: var(--ink);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
}

.progress {
  display: block;
  height: 4px;
  margin-top: var(--space-3);
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--hairline);
}

.progress > span {
  display: block;
  height: 100%;
  background: var(--brand);
}

.progress--sm {
  height: 3px;
  margin-top: var(--space-2);
}

.preview-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.preview-item {
  padding-top: var(--space-4);
  border-top: 1px solid var(--hairline);
}

.preview-item:first-child {
  padding-top: 0;
  border-top: 0;
}

.preview-item__meta {
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.preview-item__title {
  margin-top: var(--space-1);
  color: var(--ink);
  font-weight: 500;
}

.preview-item__snippet {
  margin-top: var(--space-1);
}

.auth-card {
  max-width: 520px;
}

.auth-card .tabs {
  margin-bottom: var(--space-5);
}

.link-btn {
  align-self: flex-start;
  min-height: 32px;
  padding: 0;
  border: 0;
  background: none;
  color: var(--brand);
  font-size: var(--text-sm);
  text-decoration: underline;
  text-underline-offset: 2px;
  cursor: pointer;
}

.link-btn:hover {
  color: var(--brand-strong);
}

.choice-field {
  padding: 0;
  margin: 0;
  border: 0;
}

.choice-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.choice-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.choice {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--tap);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
  cursor: pointer;
}

.choice:hover {
  border-color: var(--hairline-strong);
}

.choice:has(input:checked) {
  border-color: var(--ink);
  background: var(--panel-featured);
}

.choice input {
  width: 16px;
  height: 16px;
  accent-color: var(--brand);
}

.choice__meta {
  color: var(--muted);
  font-size: var(--text-xs);
}

.search-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-3) var(--space-4);
}

.search-row .field {
  flex: 1 1 240px;
}

.search-row > .muted {
  padding-bottom: var(--space-3);
}

.badge-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.list-row--topic,
.list-row--question {
  align-items: flex-start;
}

.list-row--topic .list-row__main {
  display: block;
}

.list-row--question .list-row__end {
  align-self: center;
}

.question-card {
  padding: var(--space-5);
}

.question-text {
  color: var(--ink);
  font-size: var(--text-lg);
  line-height: 1.55;
}

.figure-box {
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--hairline);
}

.figure {
  display: block;
  width: 100%;
  max-width: 420px;
  height: auto;
  margin: 0 auto;
  color: var(--ink);
}

.figure-box figcaption {
  margin-top: var(--space-2);
  text-align: center;
}

.actions-row {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.score-card {
  padding: var(--space-6) var(--space-5);
}

.score {
  display: flex;
  align-items: baseline;
  gap: var(--space-2);
  margin-top: var(--space-3);
  color: var(--ink);
}

.score__value {
  font-size: 56px;
  font-weight: 500;
  letter-spacing: -0.04em;
  line-height: 1;
}

.score__total {
  color: var(--muted);
  font-size: var(--text-xl);
}

.mark-list {
  list-style: none;
  border-top: 1px solid var(--hairline);
}

.mark-point {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-3) var(--space-2);
  border-bottom: 1px solid var(--hairline);
}

.mark-point__text {
  color: var(--ink);
}

.mark-point.is-missed .mark-point__text {
  color: var(--body);
}

/* ---------- Phase 2: review, assistant, progress ---------- */

.toast {
  position: absolute;
  left: 50%;
  bottom: 88px;
  z-index: 70;
  max-width: calc(100% - var(--space-6));
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--ink);
  color: var(--paper);
  font-size: var(--text-sm);
  transform: translateX(-50%);
}

.app--wide .toast {
  bottom: var(--space-5);
}

.list-row--review {
  align-items: flex-start;
}

.list-row--review .list-row__end {
  align-self: center;
}

.review-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-4);
}

.review-side {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.check-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-top: var(--space-4);
  list-style: none;
}

.check-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
}

.check-dot {
  flex: none;
  width: 6px;
  height: 6px;
  margin-top: 7px;
  border-radius: var(--radius-round);
  background: var(--brand);
}

.chat-log {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  max-height: 360px;
  padding-right: var(--space-1);
  overflow-y: auto;
}

.chat-message {
  max-width: 85%;
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
}

.chat-message--user {
  align-self: flex-end;
  border-color: var(--hairline-strong);
  background: var(--panel-featured);
}

.chat-message--assistant {
  align-self: flex-start;
}

.chat-message__meta {
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.chat-message p + p {
  margin-top: var(--space-2);
}

.chat-message__body {
  white-space: pre-line;
}

.chat-context {
  color: var(--muted);
  font-size: var(--text-xs);
}

.suggested-prompts {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  margin-top: var(--space-4);
}

.chip {
  min-height: 36px;
  padding: 0 var(--space-3);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--body);
  font-size: var(--text-sm);
  cursor: pointer;
}

.chip:hover {
  border-color: var(--hairline-strong);
  background: var(--panel);
}

.chat-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  margin-top: var(--space-5);
  padding-top: var(--space-4);
  border-top: 1px solid var(--hairline);
}

.chat-form .btn {
  align-self: flex-start;
}

.stat-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-3);
}

.stat {
  padding: var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.stat__value {
  display: block;
  color: var(--ink);
  font-size: var(--text-2xl);
  font-weight: 500;
  letter-spacing: -0.03em;
  line-height: 1;
}

.stat__label {
  display: block;
  margin-top: var(--space-2);
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.mark-topic-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  list-style: none;
}

.mark-topic {
  padding-bottom: var(--space-4);
  border-bottom: 1px solid var(--hairline);
}

.mark-topic:last-child {
  padding-bottom: 0;
  border-bottom: 0;
}

.mark-topic__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
}

.mark-topic__name {
  color: var(--ink);
  font-weight: 500;
}

.mark-topic p {
  margin-top: var(--space-2);
  font-size: var(--text-sm);
}

.bar {
  display: block;
  height: 10px;
  margin-top: var(--space-2);
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--hairline);
}

.bar > span {
  display: block;
  height: 100%;
  background: var(--brand);
}

/* Foundations */

.demo-grid {
  display: grid;
  grid-template-columns: 1fr;
  gap: var(--space-4);
}

.demo-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.demo-row {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-end;
  gap: var(--space-3);
}

.demo-stack {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.swatches {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(128px, 1fr));
  gap: var(--space-3);
}

.swatch {
  overflow: hidden;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
}

.swatch__chip {
  height: 52px;
  border-bottom: 1px solid var(--hairline);
}

.swatch__meta {
  padding: var(--space-2);
}

.swatch__name {
  color: var(--ink);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.08em;
  line-height: 1.4;
  text-transform: uppercase;
}

.swatch__hex {
  color: var(--muted);
  font-size: 11px;
  line-height: 1.4;
}

.type-row {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2) var(--space-4);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--hairline);
}

.type-row:last-child {
  border-bottom: 0;
}

.type-row__meta {
  color: var(--muted);
  font-size: 10px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.kv {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: var(--space-2) var(--space-4);
  margin: 0;
  font-size: var(--text-sm);
}

.kv dt {
  color: var(--muted);
}

.kv dd {
  margin: 0;
  color: var(--ink);
}

/* Sitemap */

.phase-group {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.phase-head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  gap: var(--space-2) var(--space-3);
}

.phase-head__title {
  font-size: var(--text-lg);
}

.screen-row__code {
  flex: 0 0 40px;
  color: var(--muted);
  font-size: 11px;
  font-weight: 500;
  letter-spacing: 0.06em;
}

.screen-row__note {
  display: block;
  margin-top: var(--space-1);
  color: var(--muted);
  font-size: var(--text-sm);
  line-height: 1.45;
}

/* Placeholder */

.placeholder-list {
  margin-top: var(--space-5);
}

/* ============================================================
   Inspect mode
   ============================================================ */

[data-inspect].is-inspected {
  outline: 1px solid var(--brand);
  outline-offset: 3px;
  border-radius: var(--radius);
}

.inspect-card {
  position: fixed;
  z-index: 300;
  width: min(300px, calc(100vw - 24px));
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
  box-shadow: var(--shadow-float);
  pointer-events: none;
}

.inspect-card[hidden] {
  display: none;
}

.inspect-card__eyebrow {
  color: var(--brand);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  line-height: 1.4;
  text-transform: uppercase;
}

.inspect-card__title {
  margin-top: var(--space-1);
  font-size: var(--text-base);
  letter-spacing: -0.02em;
  line-height: 1.3;
}

.inspect-card__body {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-top: var(--space-2);
  color: var(--body);
  font-size: var(--text-sm);
  line-height: 1.45;
}

/* ============================================================
   Wide layout — driven by a class, so the phone frame stays mobile
   ============================================================ */

.app--wide .topbar {
  position: sticky;
  top: var(--proto-h, 0px);
  z-index: 20;
}

.app--wide .topbar__inner {
  gap: var(--space-5);
  padding: var(--space-3) var(--space-6);
}

.app--wide .sidenav {
  display: block;
  flex: 0 0 232px;
  align-self: flex-start;
  max-height: calc(100vh - var(--proto-h, 0px) - 69px);
  padding: var(--space-6) var(--space-4) var(--space-6) 0;
  overflow-y: auto;
  border-right: 1px solid var(--hairline);
  position: sticky;
  top: calc(var(--proto-h, 0px) + 69px);
}

.sidenav__label {
  padding: 0 var(--space-3) var(--space-3);
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.14em;
  text-transform: uppercase;
}

.sidenav__list {
  display: flex;
  flex-direction: column;
  gap: 2px;
  list-style: none;
}

.sidenav__link {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  min-height: var(--tap);
  padding: var(--space-2) var(--space-3);
  border-left: 2px solid transparent;
  border-radius: var(--radius);
  color: var(--body);
  font-size: var(--text-sm);
  text-decoration: none;
}

.sidenav__link:hover {
  background: var(--panel);
  color: var(--ink);
}

.sidenav__link[aria-current="page"] {
  border-left-color: var(--brand);
  background: var(--panel-featured);
  color: var(--ink);
  font-weight: 500;
}

.sidenav__link svg {
  color: var(--muted);
}

.sidenav__link[aria-current="page"] svg {
  color: var(--brand);
}

.app--wide .tabbar {
  display: none;
}

.app--wide .app-main {
  padding: var(--space-6) var(--space-7) var(--space-8);
}

.app--wide .screen {
  margin-right: auto;
  margin-left: auto;
}

.app--wide .page-title {
  font-size: var(--text-3xl);
}

.app--wide .hero-card {
  padding: var(--space-7);
}

.app--wide .demo-grid {
  grid-template-columns: 1fr 1fr;
}

.app--wide .screen-row__code {
  flex-basis: 56px;
}

.app--wide .home-grid,
.app--wide .home-split {
  grid-template-columns: 1fr 1fr;
}

.app--wide .auth-card {
  max-width: 560px;
}

.app--wide .score__value {
  font-size: 64px;
}

.app--wide .review-grid {
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
}

.app--wide .chat-log {
  max-height: 420px;
}

.app--wide .stat__value {
  font-size: var(--text-3xl);
}

/* ---------- Phase 3: subject workspaces ---------- */

.workspace-grid {
  display: grid;
  gap: var(--space-5);
  align-items: start;
}

.workspace-grid > * {
  min-width: 0;
}

.code-editor {
  flex: 1;
  min-width: 0;
  min-height: 340px;
  max-height: 460px;
  margin: 0;
  padding: 12px;
  border: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.6;
  tab-size: 2;
  white-space: pre;
  overflow: auto;
  resize: vertical;
}

.code-editor:focus {
  outline: 2px solid var(--brand);
  outline-offset: -2px;
}

.output {
  padding: var(--space-4);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--panel);
}

.output__pre {
  margin: var(--space-2) 0 0;
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: 13px;
  white-space: pre-wrap;
  color: var(--ink);
}

.table-wrap {
  overflow-x: auto;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
}

.dry-table {
  width: 100%;
  border-collapse: collapse;
  font-size: var(--text-sm);
}

.dry-table th,
.dry-table td {
  padding: var(--space-1) var(--space-2);
  border-right: 1px solid var(--hairline);
  border-bottom: 1px solid var(--hairline);
  text-align: left;
  font-weight: 400;
}

.dry-table thead th {
  background: var(--panel);
  color: var(--muted);
  font-size: var(--text-xs);
  font-weight: 500;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.dry-table tbody th {
  width: 52px;
  color: var(--muted);
}

.dry-table tr:last-child th,
.dry-table tr:last-child td {
  border-bottom: 0;
}

.dry-table th:last-child,
.dry-table td:last-child {
  border-right: 0;
}

.dry-input {
  width: 100%;
  min-width: 64px;
  padding: 6px 4px;
  border: 0;
  background: transparent;
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: 13px;
}

.dry-input:focus {
  outline: 1px solid var(--brand);
  outline-offset: 0;
}

.diagram-stage {
  display: flex;
  justify-content: center;
  padding: var(--space-4);
  border: 1px dashed var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
}

.diagram-stage svg {
  width: min(420px, 100%);
  height: auto;
}

.diagram-controls {
  display: grid;
  gap: var(--space-4);
  margin-top: var(--space-4);
}

.range {
  width: 100%;
  margin-top: var(--space-2);
  accent-color: var(--brand);
}

.app--wide .workspace-grid {
  grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr);
}

/* ---------- Phase 4: community and teachers ---------- */

.feed {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
}

.feed-card {
  padding: var(--space-5);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
}

.feed-card__head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
}

.feed-card__author {
  color: var(--ink);
  font-weight: 500;
}

.feed-card__question {
  display: block;
  margin-top: var(--space-4);
  color: var(--ink);
  font-weight: 500;
  text-decoration: none;
}

.feed-card__question:hover {
  color: var(--brand-strong);
  text-decoration: underline;
  text-underline-offset: 2px;
}

.feed-card__snippet {
  margin-top: var(--space-2);
}

.feed-card__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-top: var(--space-4);
  padding-top: var(--space-3);
  border-top: 1px solid var(--hairline);
}

.feed-card__actions .link-btn {
  color: var(--muted);
  font-size: var(--text-sm);
}

.feed-card__actions .link-btn[aria-pressed="true"] {
  color: var(--brand);
}

.list-row--button {
  width: 100%;
  border: 0;
  border-bottom: 1px solid var(--hairline);
  background: transparent;
  font: inherit;
  text-align: left;
  cursor: pointer;
}

.list-row--button:hover {
  background: var(--panel);
}

.unread-dot {
  flex: none;
  width: 7px;
  height: 7px;
  border-radius: var(--radius-round);
  background: transparent;
}

.unread-dot.is-unread {
  background: var(--brand);
}

.class-grid {
  display: grid;
  gap: var(--space-4);
}

.class-card {
  padding: var(--space-5);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.class-card__head {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-3);
}

.class-card__title {
  color: var(--ink);
  font-size: var(--text-lg);
  font-weight: 500;
  letter-spacing: -0.02em;
}

.class-card__code {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
  margin-top: var(--space-4);
  font-size: var(--text-sm);
}

.class-card .actions-row {
  margin-top: var(--space-4);
}

.code-chip {
  display: inline-block;
  padding: 2px var(--space-2);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: var(--text-xs);
  letter-spacing: 0.06em;
}

.student-list {
  border-top: 1px solid var(--hairline);
}

.student-row {
  display: flex;
  align-items: center;
  gap: var(--space-4);
  padding: var(--space-3) var(--space-2);
  border-bottom: 1px solid var(--hairline);
}

.student-row__main {
  flex: 1;
  min-width: 0;
}

.student-row__name {
  display: block;
  color: var(--ink);
  font-weight: 500;
}

.student-row__meta {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: var(--text-sm);
}

.student-row__value {
  flex: none;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

.student-row .bar {
  margin-top: var(--space-2);
}

.file-input {
  padding: var(--space-2);
}

.app--wide .page-head--row {
  flex-direction: row;
  align-items: flex-end;
  justify-content: space-between;
}

.app--wide .class-grid {
  grid-template-columns: repeat(2, minmax(0, 1fr));
}

/* ---------- Phase 5: profile and list states ---------- */

.proto-state {
  display: inline-flex;
  align-items: center;
  gap: var(--space-2);
}

.select-wrap--compact {
  width: 104px;
}

.select--compact {
  min-height: 32px;
  padding: 4px var(--space-6) 4px var(--space-2);
  font-size: var(--text-xs);
}

.select-wrap--compact::after {
  right: var(--space-2);
  width: 6px;
  height: 6px;
}

.avatar {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 40px;
  height: 40px;
  border-radius: var(--radius-round);
  background: var(--panel-featured);
  color: var(--ink);
  font-weight: 500;
  letter-spacing: 0.02em;
}

.avatar--lg {
  width: 64px;
  height: 64px;
  font-size: var(--text-xl);
}

.profile-card {
  display: flex;
  align-items: center;
  gap: var(--space-4);
}

.state-block {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  padding: var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.skeleton-row {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  padding: var(--space-3) 0;
  border-bottom: 1px solid var(--hairline);
}

.skeleton-row:last-child {
  border-bottom: 0;
}

.skeleton {
  display: block;
  height: 12px;
  border-radius: var(--radius);
  background: var(--panel-featured);
}

.skeleton--title {
  width: 55%;
  height: 14px;
}

.skeleton--meta {
  width: 35%;
}

/* ---------- Question hub ---------- */

.question-tabs {
  display: flex;
  gap: var(--space-4);
  overflow-x: auto;
  border-bottom: 1px solid var(--hairline);
}

.question-tabs .tab {
  display: inline-flex;
  align-items: center;
  white-space: nowrap;
  text-decoration: none;
}

.question-tabs .tab[aria-current="page"] {
  border-bottom-color: var(--brand);
  color: var(--ink);
}

.upload {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
}

.upload__drop {
  position: relative;
  border: 1px dashed var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--paper);
  transition: border-color 120ms ease, background-color 120ms ease;
}

.upload__drop:hover,
.upload__drop.is-dragging {
  border-color: var(--brand);
  background: var(--panel);
}

.upload__input {
  position: absolute;
  width: 1px;
  height: 1px;
  opacity: 0;
}

.upload__input:focus-visible + .upload__label {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
}

.upload__label {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--space-1);
  min-height: 104px;
  padding: var(--space-4);
  text-align: center;
  cursor: pointer;
}

.upload__icon {
  color: var(--muted);
}

.upload__title {
  color: var(--ink);
  font-size: var(--text-sm);
  font-weight: 500;
}

.upload__hint {
  color: var(--muted);
  font-size: var(--text-xs);
}

.upload__file {
  display: flex;
  align-items: center;
  gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.upload__badge {
  flex: none;
  padding: 2px var(--space-2);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  color: var(--muted);
  font-size: 9px;
  font-weight: 500;
  letter-spacing: 0.1em;
}

.upload__meta {
  display: flex;
  flex: 1;
  min-width: 0;
  flex-direction: column;
}

.upload__name {
  overflow: hidden;
  color: var(--ink);
  font-size: var(--text-sm);
  text-overflow: ellipsis;
  white-space: nowrap;
}

.upload__size {
  color: var(--muted);
  font-size: var(--text-xs);
}

.upload__preview {
  display: grid;
  place-items: center;
  margin: 0;
  padding: var(--space-2);
  aspect-ratio: 16 / 10;
  overflow: hidden;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.upload__preview img {
  display: block;
  max-width: 100%;
  max-height: 100%;
  width: auto;
  height: auto;
  object-fit: contain;
  border-radius: var(--radius);
}

.scan-result {
  padding: var(--space-4);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--panel);
}

.scan-result__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-2);
}

.scan-result__score {
  color: var(--ink);
  font-size: var(--text-xl);
  font-weight: 500;
  letter-spacing: -0.03em;
}

.scan-points {
  margin-top: var(--space-3);
  border-top: 1px solid var(--hairline);
  list-style: none;
}

.scan-point {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--hairline);
  font-size: var(--text-sm);
}

.scan-point:last-child {
  border-bottom: 0;
}

.scan-point__text {
  color: var(--ink);
}

.scan-result--busy {
  background: var(--paper);
}

.scan-dot {
  width: 8px;
  height: 8px;
  border-radius: var(--radius-round);
  background: var(--brand);
  animation: scan-pulse 900ms ease-in-out infinite;
}

@keyframes scan-pulse {
  0%, 100% { opacity: 0.25; }
  50% { opacity: 1; }
}

.scan-steps {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-1);
  list-style: none;
  color: var(--body);
  font-size: var(--text-sm);
}

.scan-steps li {
  position: relative;
  padding-left: var(--space-4);
}

.scan-steps li::before {
  content: "";
  position: absolute;
  left: 0;
  top: 0.65em;
  width: 5px;
  height: 5px;
  background: var(--hairline-strong);
  border-radius: var(--radius-round);
}

.scan-feedback {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-4);
  padding-top: var(--space-3);
  border-top: 1px solid var(--hairline);
  color: var(--body);
  font-size: var(--text-sm);
}

.help-card {
  display: flex;
  flex-direction: column;
  gap: var(--space-4);
  padding: var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.help-card__modes {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
}

.help-thread {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.help-message {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
}

.help-message__label {
  color: var(--muted);
  font-size: 10px;
  font-weight: 500;
  letter-spacing: 0.1em;
  text-transform: uppercase;
}

.help-reply {
  padding: var(--space-3);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
  color: var(--ink);
  font-size: var(--text-sm);
  white-space: pre-line;
}

.help-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.help-form .btn {
  align-self: flex-start;
}

.solution-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  list-style: none;
}

.solution-card {
  padding: var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
}

.solution-card__head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
}

.solution-card__author {
  color: var(--ink);
  font-weight: 500;
}

.solution-card__meta {
  color: var(--muted);
  font-size: var(--text-sm);
}

.solution-card__snippet {
  margin-top: var(--space-2);
}

.solution-card__actions {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-4);
  margin-top: var(--space-3);
  padding-top: var(--space-2);
  border-top: 1px solid var(--hairline);
}

.solution-card__actions .link-btn {
  color: var(--muted);
}

.solution-card__actions .link-btn[aria-pressed="true"] {
  color: var(--brand);
}

.solution-detail {
  display: flex;
  flex-direction: column;
  gap: var(--space-5);
}

.comment-thread {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  list-style: none;
}

.comment {
  display: flex;
  gap: var(--space-3);
  padding: var(--space-3);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
}

.comment__avatar {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 32px;
  height: 32px;
  border-radius: var(--radius-round);
  background: var(--panel-featured);
  color: var(--ink);
  font-size: 11px;
  font-weight: 500;
}

.comment__body {
  flex: 1;
  min-width: 0;
}

.comment__text {
  color: var(--body);
  font-size: var(--text-sm);
}

.comment__actions {
  display: flex;
  gap: var(--space-3);
  margin-top: var(--space-2);
}

.comment__actions .link-btn {
  font-size: var(--text-xs);
  color: var(--muted);
}

.comment__replies {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-3);
  padding-left: var(--space-4);
  border-left: 1px solid var(--hairline);
  list-style: none;
}

.comment--reply {
  background: var(--panel);
}

.comment-reply-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  margin-top: var(--space-3);
}

.comment-reply-form .input {
  min-height: 40px;
}

.comment__head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--space-2);
}

.comment__author {
  color: var(--ink);
  font-size: var(--text-sm);
  font-weight: 500;
}

.comment-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
}

.comment-form .btn {
  align-self: flex-start;
}

.top-solution {
  letter-spacing: 0.08em;
}

.discussion-thread {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  list-style: none;
}

.discussion-comment {
  padding: var(--space-3);
  border-left: 2px solid var(--hairline-strong);
  background: var(--paper);
}

.discussion-form {
  display: flex;
  flex-direction: column;
  gap: var(--space-3);
  margin-top: var(--space-4);
}

.discussion-form .btn {
  align-self: flex-start;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: var(--space-3);
}

.stat__value--text {
  font-size: var(--text-lg);
  letter-spacing: -0.02em;
}

.year-list {
  display: flex;
  flex-wrap: wrap;
  gap: var(--space-2);
  list-style: none;
}

/* ---------- Code workspace, uploads and comment threads ---------- */

.filter-bar .filter-bar__wide {
  flex: 1 1 100%;
}

.notice {
  padding: var(--space-3) var(--space-4);
  border-left: 2px solid var(--brand);
  border-radius: var(--radius);
  background: var(--panel);
  font-size: var(--text-sm);
}

.code-layout {
  display: grid;
  gap: var(--space-4);
  align-items: start;
}

.code-layout > * {
  min-width: 0;
}

.code-window {
  overflow: hidden;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--paper);
}

.code-window__bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-2);
  padding: var(--space-2) var(--space-3);
  border-bottom: 1px solid var(--hairline);
  background: var(--panel);
}

.code-window__name {
  color: var(--muted);
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: var(--text-xs);
  letter-spacing: 0.04em;
}

.code-editor-wrap {
  display: flex;
  overflow: hidden;
  max-height: 460px;
}

.code-gutter {
  flex: none;
  min-width: 42px;
  margin: 0;
  padding: 12px 8px 12px 10px;
  overflow: hidden;
  border-right: 1px solid var(--hairline);
  background: var(--panel);
  color: var(--muted);
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.6;
  text-align: right;
  user-select: none;
}

.console {
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--panel);
}

.console__head {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--space-3);
}

.console__head .link-btn {
  color: var(--muted);
  font-size: var(--text-xs);
}

.console__pre {
  margin: var(--space-2) 0 0;
  color: var(--ink);
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: 13px;
  line-height: 1.6;
  white-space: pre-wrap;
}

.console__status {
  margin-top: var(--space-2);
  color: var(--ink);
  font-size: var(--text-sm);
}

.console__status--error {
  color: var(--error);
}

.console__meta {
  margin-top: var(--space-2);
  color: var(--muted);
  font-size: var(--text-xs);
}

.code-block {
  margin: var(--space-2) 0 0;
  padding: var(--space-3);
  overflow-x: auto;
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
  color: var(--ink);
  font-family: "SFMono-Regular", "Consolas", "Liberation Mono", monospace;
  font-size: var(--text-xs);
  line-height: 1.6;
  white-space: pre;
}

.review-card {
  padding: var(--space-4);
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius);
  background: var(--paper);
}

.review-card--busy {
  border-style: dashed;
  background: var(--panel);
}

.review-card__head {
  display: flex;
  flex-wrap: wrap;
  align-items: flex-start;
  justify-content: space-between;
  gap: var(--space-2);
  margin-bottom: var(--space-3);
}

.review-card__score {
  color: var(--ink);
  font-size: var(--text-xl);
  font-weight: 500;
  letter-spacing: -0.03em;
}

.review-list {
  display: flex;
  flex-direction: column;
  gap: var(--space-2);
  list-style: none;
}

.review-item {
  display: flex;
  align-items: flex-start;
  gap: var(--space-3);
  padding: var(--space-2) 0;
  border-bottom: 1px solid var(--hairline);
}

.review-item:last-child {
  border-bottom: 0;
}

.review-item__mark {
  display: inline-flex;
  flex: none;
  align-items: center;
  justify-content: center;
  width: 18px;
  height: 18px;
  border: 1px solid var(--hairline-strong);
  border-radius: var(--radius-round);
  color: var(--ink);
  font-size: 11px;
  font-weight: 500;
}

.review-item.is-met .review-item__mark {
  border-color: var(--ink);
  background: var(--ink);
  color: var(--paper);
}

.review-item.is-missing .review-item__mark {
  border-color: var(--error);
  color: var(--error);
}

.review-item__body {
  display: flex;
  flex-direction: column;
  gap: 2px;
  min-width: 0;
}

.review-item__label {
  color: var(--ink);
  font-size: var(--text-sm);
}

.review-item__fix {
  color: var(--muted);
  font-size: var(--text-xs);
}

.review-findings {
  margin-top: var(--space-4);
  padding-top: var(--space-3);
  border-top: 1px solid var(--hairline);
}

.review-findings__list {
  display: flex;
  flex-direction: column;
  gap: var(--space-1);
  margin-top: var(--space-2);
  list-style: none;
}

.review-finding {
  position: relative;
  padding-left: var(--space-4);
  color: var(--body);
  font-size: var(--text-sm);
}

.review-finding::before {
  content: "!";
  position: absolute;
  left: 0;
  color: var(--error);
  font-weight: 500;
}

/* ---------- Walkthrough and ink ---------- */

.walkthrough-stage {
  position: relative;
  width: 100%;
  max-width: 420px;
  margin: var(--space-4) auto 0;
}

.walkthrough-stage .figure {
  max-width: none;
}

.ink-layer {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.ink-layer svg {
  display: block;
  width: 100%;
  height: 100%;
}

.player {
  padding: var(--space-3) var(--space-4);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.player__bar {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: var(--space-2);
}

.player__scrub {
  flex: 1 1 120px;
  min-width: 100px;
  accent-color: var(--brand);
}

.player__count {
  color: var(--muted);
  font-size: var(--text-xs);
  font-variant-numeric: tabular-nums;
}

.player__caption {
  margin-top: var(--space-3);
  color: var(--ink);
  font-size: var(--text-sm);
}

/* ---------- Teacher insight and student detail ---------- */

a.student-row {
  display: flex;
  color: inherit;
  text-decoration: none;
}

a.student-row:hover {
  background: var(--panel);
}

.dist {
  display: flex;
  align-items: flex-end;
  gap: var(--space-2);
  height: 132px;
  padding: var(--space-3);
  border: 1px solid var(--hairline);
  border-radius: var(--radius);
  background: var(--panel);
}

.dist__bucket {
  display: flex;
  flex: 1;
  height: 100%;
  flex-direction: column;
  align-items: center;
  justify-content: flex-end;
  gap: 4px;
  min-width: 0;
}

.dist__bar {
  width: 100%;
  max-width: 34px;
  background: var(--brand);

  <script>
/* ============================================================
   Excelerate — pseudocode runner
   A small interpreter for the CAIE-style pseudocode used by the
   Computer Science questions. It is deliberately limited: no file
   I/O, no classes, one-dimensional arrays only.

   Usage:
     var result = Pseudo.run(source, inputText);
     // { ok: true, output: ["Line 1", ...], steps: 12 }
     // { ok: false, error: "Unknown variable x", line: 4, output: [...] }

   Everything is local and synchronous. Nothing leaves the page.
   ============================================================ */

var Pseudo = (function () {
  "use strict";

  var MAX_STEPS = 400000;
  var MAX_DEPTH = 60;
  var MAX_OUTPUT = 200;

  /* ---------- Tokenizer (for expressions on one line) ---------- */

  function tokenize(source) {
    var tokens = [];
    var index = 0;
    while (index < source.length) {
      var character = source.charAt(index);
      if (/\s/.test(character)) {
        index += 1;
        continue;
      }
      if (character === '"' || character === "'") {
        var quote = character;
        var text = "";
        index += 1;
        while (index < source.length && source.charAt(index) !== quote) {
          if (source.charAt(index) === "\\" && index + 1 < source.length) {
            index += 1;
            text += source.charAt(index);
          } else {
            text += source.charAt(index);
          }
          index += 1;
        }
        if (index >= source.length) throw { message: "Unclosed text string" };
        index += 1;
        tokens.push({ type: "string", value: text });
        continue;
      }
      if (/[0-9]/.test(character) || (character === "." && /[0-9]/.test(source.charAt(index + 1)))) {
        var number = "";
        while (index < source.length && /[0-9.]/.test(source.charAt(index))) {
          number += source.charAt(index);
          index += 1;
        }
        if ((number.match(/\./g) || []).length > 1) throw { message: "Bad number " + number };
        tokens.push({ type: "number", value: Number(number) });
        continue;
      }
      if (/[A-Za-z_]/.test(character)) {
        var word = "";
        while (index < source.length && /[A-Za-z0-9_]/.test(source.charAt(index))) {
          word += source.charAt(index);
          index += 1;
        }
        tokens.push({ type: "word", value: word });
        continue;
      }
      var pair = source.substr(index, 2);
      if (pair === "<-" || pair === "<>" || pair === "<=" || pair === ">=") {
        tokens.push({ type: "op", value: pair });
        index += 2;
        continue;
      }
      if ("+-*/^&()[],:<>.".indexOf(character) !== -1) {
        tokens.push({ type: "op", value: character });
        index += 1;
        continue;
      }
      throw { message: "Unexpected character " + character };
    }
    return tokens;
  }

  /* ---------- Expression parser ---------- */

  function Parser(tokens) {
    this.tokens = tokens;
    this.position = 0;
  }

  Parser.prototype.peek = function () {
    return this.tokens[this.position] || null;
  };

  Parser.prototype.next = function () {
    var token = this.tokens[this.position];
    if (!token) throw { message: "The line ends too early" };
    this.position += 1;
    return token;
  };

  Parser.prototype.isOp = function (value) {
    var token = this.peek();
    return token && token.type === "op" && token.value === value;
  };

  Parser.prototype.isWord = function (value) {
    var token = this.peek();
    return token && token.type === "word" && token.value.toUpperCase() === value;
  };

  Parser.prototype.acceptOp = function (value) {
    if (!this.isOp(value)) return false;
    this.position += 1;
    return true;
  };

  Parser.prototype.acceptWord = function (value) {
    if (!this.isWord(value)) return false;
    this.position += 1;
    return true;
  };

  Parser.prototype.expectOp = function (value) {
    if (!this.acceptOp(value)) throw { message: "Expected " + value };
  };

  Parser.prototype.parse = function () {
    var node = this.parseOr();
    if (this.peek()) {
      var token = this.peek();
      throw { message: "Unexpected " + (token.value === undefined ? token.type : token.value) };
    }
    return node;
  };

  Parser.prototype.parseOr = function () {
    var node = this.parseAnd();
    while (this.isWord("OR")) {
      this.next();
      node = { type: "binary", op: "OR", left: node, right: this.parseAnd() };
    }
    return node;
  };

  Parser.prototype.parseAnd = function () {
    var node = this.parseNot();
    while (this.isWord("AND")) {
      this.next();
      node = { type: "binary", op: "AND", left: node, right: this.parseNot() };
    }
    return node;
  };

  Parser.prototype.parseNot = function () {
    if (this.isWord("NOT")) {
      this.next();
      return { type: "unary", op: "NOT", value: this.parseNot() };
    }
    return this.parseCompare();
  };

  Parser.prototype.parseCompare = function () {
    var node = this.parseAdd();
    while (this.peek() && this.peek().type === "op" &&
      ["=", "<>", "<", ">", "<=", ">="].indexOf(this.peek().value) !== -1) {
      var op = this.next().value;
      node = { type: "binary", op: op, left: node, right: this.parseAdd() };
    }
    return node;
  };

  Parser.prototype.parseAdd = function () {
    var node = this.parseMul();
    while (this.peek() && this.peek().type === "op" && ["+", "-", "&"].indexOf(this.peek().value) !== -1) {
      var op = this.next().value;
      node = { type: "binary", op: op, left: node, right: this.parseMul() };
    }
    return node;
  };

  Parser.prototype.parseMul = function () {
    var node = this.parseUnary();
    for (;;) {
      if (this.peek() && this.peek().type === "op" && ["*", "/"].indexOf(this.peek().value) !== -1) {
        var op = this.next().value;
        node = { type: "binary", op: op, left: node, right: this.parseUnary() };
        continue;
      }
      if (this.isWord("DIV") || this.isWord("MOD")) {
        var word = this.next().value.toUpperCase();
        node = { type: "binary", op: word, left: node, right: this.parseUnary() };
        continue;
      }
      return node;
    }
  };

  Parser.prototype.parseUnary = function () {
    if (this.isOp("-")) {
      this.next();
      return { type: "unary", op: "-", value: this.parseUnary() };
    }
    if (this.isOp("+")) {
      this.next();
      return this.parseUnary();
    }
    return this.parsePower();
  };

  Parser.prototype.parsePower = function () {
    var node = this.parsePrimary();
    if (this.isOp("^")) {
      this.next();
      node = { type: "binary", op: "^", left: node, right: this.parseUnary() };
    }
    return node;
  };

  Parser.prototype.parsePrimary = function () {
    var token = this.next();
    var node;
    if (token.type === "number") node = { type: "number", value: token.value };
    else if (token.type === "string") node = { type: "string", value: token.value };
    else if (token.type === "word") {
      var upper = token.value.toUpperCase();
      if (upper === "TRUE") node = { type: "boolean", value: true };
      else if (upper === "FALSE") node = { type: "boolean", value: false };
      else {
        var name = token.value.toLowerCase();
        if (this.isOp("(")) {
          this.next();
          var args = [];
          if (!this.isOp(")")) {
            args.push(this.parseOr());
            while (this.acceptOp(",")) args.push(this.parseOr());
          }
          this.expectOp(")");
          node = { type: "call", name: name, args: args };
        } else if (this.isOp("[")) {
          this.next();
          var first = this.parseOr();
          if (this.acceptOp(",")) {
            var second = this.parseOr();
            this.expectOp("]");
            node = { type: "index2", name: name, row: first, column: second };
          } else {
            this.expectOp("]");
            node = { type: "index", name: name, index: first };
          }
        } else {
          node = { type: "name", name: name };
        }
      }
    } else if (token.type === "op" && token.value === "(") {
      node = this.parseOr();
      this.expectOp(")");
    } else {
      throw { message: "Unexpected " + (token.value === undefined ? token.type : token.value) };
    }

    while (this.isOp(".")) {
      this.next();
      var field = this.next();
      if (field.type !== "word") throw { message: "Expected a field name after ." };
      node = { type: "field", object: node, name: field.value.toLowerCase() };
    }

    return node;
  };

  /* ---------- Line helpers ---------- */

  function stripComment(line) {
    var out = "";
    var inString = false;
    var quote = "";
    for (var i = 0; i < line.length; i += 1) {
      var character = line.charAt(i);
      if (inString) {
        out += character;
        if (character === quote) inString = false;
        continue;
      }
      if (character === '"' || character === "'") {
        inString = true;
        quote = character;
        out += character;
        continue;
      }
      if (character === "/" && line.charAt(i + 1) === "/") break;
      out += character;
    }
    return out;
  }

  function parseExpression(source) {
    if (!source || !source.trim()) throw { message: "Missing expression" };
    return new Parser(tokenize(source)).parse();
  }

  function splitArguments(source) {
    var parts = [];
    var depth = 0;
    var current = "";
    var inString = false;
    var quote = "";
    for (var i = 0; i < source.length; i += 1) {
      var character = source.charAt(i);
      if (inString) {
        current += character;
        if (character === quote) inString = false;
        continue;
      }
      if (character === '"' || character === "'") {
        inString = true;
        quote = character;
        current += character;
        continue;
      }
      if (character === "(" || character === "[") depth += 1;
      if (character === ")" || character === "]") depth -= 1;
      if (character === "," && depth === 0) {
        parts.push(current);
        current = "";
        continue;
      }
      current += character;
    }
    if (current.trim()) parts.push(current);
    return parts;
  }

  function topLevelIndex(source, character) {
    var depth = 0;
    var inString = false;
    var quote = "";
    for (var i = 0; i < source.length; i += 1) {
      var current = source.charAt(i);
      if (inString) {
        if (current === quote) inString = false;
        continue;
      }
      if (current === '"' || current === "'") {
        inString = true;
        quote = current;
        continue;
      }
      if (current === "(" || current === "[") depth += 1;
      if (current === ")" || current === "]") depth -= 1;
      if (depth === 0 && current === character) return i;
    }
    return -1;
  }

  function splitTopLevel(source, keyword) {    var parts = [];
    var depth = 0;
    var inString = false;
    var quote = "";
    var upper = source.toUpperCase();
    var index = 0;
    var start = 0;
    while (index < source.length) {
      var character = source.charAt(index);
      if (inString) {
        if (character === quote) inString = false;
        index += 1;
        continue;
      }
      if (character === '"' || character === "'") {
        inString = true;
        quote = character;
        index += 1;
        continue;
      }
      if (character === "(" || character === "[") depth += 1;
      if (character === ")" || character === "]") depth -= 1;
      if (depth === 0 && upper.substr(index, keyword.length) === keyword) {
        parts.push(source.slice(start, index));
        index += keyword.length;
        start = index;
        continue;
      }
      index += 1;
    }
    parts.push(source.slice(start));
    return parts;
  }

  /* ---------- Statements on one line (CASE branches) ---------- */

  function parseInlineStatement(text, line) {
    var trimmed = String(text).trim();
    var wordMatch = trimmed.match(/^([A-Za-z]+)/);
    var word = wordMatch ? wordMatch[1].toUpperCase() : "";

    if (word === "OUTPUT" || word === "PRINT" || word === "WRITE") {
      return {
        type: "output",
        values: splitArguments(trimmed.slice(word.length).trim()).map(parseExpression),
        line: line
      };
    }

    if (word === "CALL") {
      var callMatch = trimmed.slice(4).trim().match(/^([A-Za-z_][A-Za-z0-9_]*)\s*(?:\((.*)\))?$/);
      if (!callMatch) throw { message: "CALL needs a procedure name", line: line };
      return {
        type: "call",
        name: callMatch[1].toLowerCase(),
        args: callMatch[2] ? splitArguments(callMatch[2]).map(parseExpression) : [],
        line: line
      };
    }

    var arrow = trimmed.indexOf("<-");
    if (arrow !== -1) {
      var targetText = trimmed.slice(0, arrow).trim();
      var valueText = trimmed.slice(arrow + 2).trim();
      return { type: "assign", target: parseTarget(targetText, line), value: parseExpression(valueText), line: line };
    }

    throw { message: "A CASE branch can OUTPUT, CALL or assign", line: line };
  }

  function parseTarget(text, line) {
    var node = parseExpression(text);
    if (node.type === "name" || node.type === "index" || node.type === "field") return node;
    throw { message: "Cannot store a value in " + text, line: line };
  }

  /* ---------- Statement parser ---------- */

  function Program(source) {
    this.lines = [];
    var raw = String(source).replace(/\r\n?/g, "\n").split("\n");
    for (var i = 0; i < raw.length; i += 1) {
      var text = stripComment(raw[i]).trim();
      // Accept "END IF", "END PROCEDURE" and the one-word forms.
      text = text.replace(/^END\s+(IF|WHILE|PROCEDURE|FUNCTION|FOR|CASE)\b/i, function (match, keyword) {
        return "END" + keyword.toUpperCase();
      });
      if (text) this.lines.push({ text: text, line: i + 1 });
    }
    this.position = 0;
    this.blocks = [];
  }

  Program.prototype.firstWord = function () {
    var match = this.lines[this.position].text.match(/^([A-Za-z]+)/);
    return match ? match[1].toUpperCase() : "";
  };

  Program.prototype.parseBlock = function (stops) {
    var statements = [];
    while (this.position < this.lines.length) {
      var word = this.firstWord();
      if (stops.indexOf(word) !== -1) break;
      statements.push(this.parseStatement());
    }
    return statements;
  };

  Program.prototype.expectWord = function (word, anchorLine) {
    var atEnd = this.position >= this.lines.length;
    var line = atEnd
      ? (anchorLine || (this.lines.length ? this.lines[this.lines.length - 1].line : 0))
      : this.lines[this.position].line;
    if (atEnd || this.firstWord() !== word) {
      throw { message: "Expected " + word, line: line };
    }
    this.position += 1;
  };

  Program.prototype.parseStatement = function () {
    var entry = this.lines[this.position];
    var text = entry.text;
    var line = entry.line;
    var word = this.firstWord();
    var rest = text.slice(word.length).trim();
    var statement;

    if (word === "IF") {
      var conditionText = text.replace(/^IF\s+/i, "").replace(/\s+THEN\s*$/i, "");
      if (!/\sTHEN\s*$/i.test(text)) throw { message: "IF needs THEN at the end", line: line };
      this.position += 1;
      var thenBody = this.parseBlock(["ELSE", "ENDIF"]);
      var elseBody = [];
      if (this.position < this.lines.length && this.firstWord() === "ELSE") {
        this.position += 1;
        elseBody = this.parseBlock(["ENDIF"]);
      }
      this.expectWord("ENDIF", line);
      statement = { type: "if", test: parseExpression(conditionText), then: thenBody, otherwise: elseBody, line: line };
      return statement;

          }
          var whileSignal = this.run(statement.body);
          if (whileSignal) return whileSignal;

        return null;
      }
      case "repeat": {
        var rounds = 0;
        do {
          rounds += 1;
          if (rounds > MAX_STEPS) {
            throw { message: "This REPEAT loop never ends", line: this.line };
          }
          var repeatSignal = this.run(statement.body);
          if (repeatSignal) return repeatSignal;
        } while (!toBoolean(this.evaluate(statement.test)));

      }
      case "routine":
        this.routines[statement.name] = statement;
        return null;
      case "type":
        this.types[statement.name] = { fields: statement.fields };

        if (!this.files[openName]) this.files[openName] = { lines: [], cursor: 0, mode: "" };

        this.files[openName].cursor = 0;
        this.files[openName].mode = statement.mode;

      case "writefile": {

        if (writeFile.mode !== "WRITE" && writeFile.mode !== "APPEND") {

      }

  Runtime.prototype.store = function (target, value) {
    if (target.type === "name") {
      this.assign(target.name, value);
      return;
    }
    if (target.type === "index") {
      var array = this.lookup(target.name);
      if (!Array.isArray(array)) throw { message: target.name + " is not an array", line: this.line };

  };

  /* ---------- Assignment statements ---------- */

  Program.prototype.parseAssignment = function () {
    var entry = this.lines[this.position];
    var parts = entry.text.split("<-");
    if (parts.length < 2) {
      throw { message: "Expected an assignment with <-", line: entry.line };
    }
    var targetText = parts.shift().trim();
    var valueText = parts.join("<-").trim();

  Program.prototype.parseStatement = function () {

  function run(source, inputText) {

    runtime.inputs = String(inputText || "")
      .split(/\r?\n/)
      .map(function (line) { return line.trim(); })
      .filter(function (line, index, all) { return line !== "" || index < all.length - 1; });

    var program;
    try {
      program = new Program(source);
      var statements = program.parseBlock([]);
      if (program.position < program.lines.length) {
        throw { message: "Unexpected " + program.lines[program.position].text, line: program.lines[program.position].line };
      }
      runtime.run(statements);
      return { ok: true, output: runtime.outputs, steps: runtime.steps, error: null, line: 0 };
    } catch (error) {
      var message = error && error.message ? error.message : "Something in the program could not be read";
      return {
        ok: false,
        output: runtime.outputs,
        steps: runtime.steps,
        error: message,
        line: error && error.line ? error.line : runtime.line
      };
    }
  }

  /* ---------- Facts, lints and review ---------- */

  function newFacts() {
    return {
      declares: [],
      arrays: [],
      inputs: 0,
      outputs: [],
      outputVariables: 0,
      fors: [],
      whiles: 0,
      repeats: 0,
      ifs: [],
      routines: [],
      calls: [],
      assigns: [],
      selfAssigns: [],
      returns: 0,
      reads: []
    };
  }

  function collectNames(node, out) {
    if (!node) return;
    switch (node.type) {
      case "name":
        out.push(node.name);
        return;
      case "index":
        out.push(node.name);
        collectNames(node.index, out);
        return;
      case "index2":
        out.push(node.name);
        collectNames(node.row, out);
        collectNames(node.column, out);
        return;
      case "unary":
        collectNames(node.value, out);
        return;
      case "binary":
        collectNames(node.left, out);
        collectNames(node.right, out);
        return;
      case "call":
        node.args.forEach(function (argument) {
          collectNames(argument, out);
        });
        return;
      case "field":
        collectNames(node.object, out);
        return;
      default:
        return;
    }
  }

  function literalNumber(node) {
    if (!node) return null;
    if (node.type === "number") return node.value;
    if (node.type === "unary" && node.op === "-" && node.value.type === "number") return -node.value.value;
    return null;
  }

  function conditionInfo(test) {
    var info = { op: null, names: [], otherNames: [] };
    if (!test) return info;
    if (test.type === "binary" && ["=", "<>", "<", ">", "<=", ">="].indexOf(test.op) !== -1) {
      info.op = test.op;
      collectNames(test.left, info.names);
      collectNames(test.right, info.otherNames);
      info.names = info.names.concat(info.otherNames);
    }
    return info;
  }

  function assignedNames(statements, out) {
    statements.forEach(function (statement) {
      switch (statement.type) {
        case "assign":
          if (statement.target.type !== "field") out.push(statement.target.name);
          break;
        case "input":
          statement.targets.forEach(function (target) {
            if (target.type === "name") out.push(target.name);
            if (target.type === "index") out.push(target.name);
          });
          break;
        case "if":
          assignedNames(statement.then, out);
          assignedNames(statement.otherwise, out);
          break;
        case "case":
          statement.branches.forEach(function (branch) {
            assignedNames([branch.statement], out);
          });
          if (statement.otherwise) assignedNames([statement.otherwise], out);
          break;
        case "for":
        case "while":
        case "repeat":
          assignedNames(statement.body, out);
          break;
        case "routine":
          assignedNames(statement.body, out);
          break;
        default:
          break;
      }
    });
    return out;
  }

  function collectFacts(statements, facts) {
    statements.forEach(function (statement) {
      switch (statement.type) {
        case "declare":
          statement.names.forEach(function (entry) {
            facts.declares.push(entry.name);
            if (entry.bounds) facts.arrays.push(entry.name);
          });
          break;
        case "input":
          facts.inputs += statement.targets.length;
          statement.targets.forEach(function (target) {
            if (target.type === "index") collectNames(target.index, facts.reads);

          break;

          var variables = [];
          statement.values.forEach(function (value) {
            collectNames(value, variables);
          });

          facts.outputVariables += variables.length;
          statement.values.forEach(function (value) {
            collectNames(value, facts.reads);
          });
          break;
        case "assign":
          if (statement.target.type === "field") {
            collectNames(statement.target.object, facts.reads);
          } else {
            facts.assigns.push(statement.target.name);
          }
