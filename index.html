<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Excelerate — structural prototype</title>
  <meta name="description" content="Clickable structural prototype for Excelerate, a CAIE A Level exam practice platform.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/styles.css">
</head>
<body>
  <a class="skip-link" href="#screen">Skip to content</a>

  <!-- Prototype controls. These sit outside the app on purpose. -->
  <div class="proto-bar" id="protoBar">
    <div class="proto-bar__inner" data-inspect="chrome.bar">
      <span class="proto-bar__label">Prototype controls</span>

      <div class="segmented" role="group" aria-label="Preview as role" data-inspect="chrome.role">
        <button type="button" class="segmented__btn" data-role="student" aria-pressed="true">Student</button>
        <button type="button" class="segmented__btn" data-role="teacher" aria-pressed="false">Teacher</button>
        <button type="button" class="segmented__btn" data-role="reviewer" aria-pressed="false">Reviewer</button>
      </div>

      <span class="proto-bar__divider" aria-hidden="true"></span>

      <label class="switch" data-inspect="chrome.mobile">
        <input type="checkbox" id="mobileViewToggle" role="switch" aria-checked="false">
        <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
        <span class="switch__label">Mobile app view</span>
      </label>

      <label class="switch" data-inspect="chrome.inspect">
        <input type="checkbox" id="inspectToggle" role="switch" aria-checked="false">
        <span class="switch__track" aria-hidden="true"><span class="switch__thumb"></span></span>
        <span class="switch__label">Inspect mode</span>
      </label>

      <span class="proto-bar__divider" aria-hidden="true"></span>

      <label class="proto-state" data-inspect="chrome.listState">
        <span class="switch__label">List state</span>
        <span class="select-wrap select-wrap--compact">
          <select class="select select--compact" id="listStateSelect" aria-label="Preview list state">
            <option value="default">Default</option>
            <option value="loading">Loading</option>
            <option value="empty">Empty</option>
            <option value="error">Error</option>
          </select>
        </span>
      </label>

      <span class="proto-bar__divider" aria-hidden="true"></span>

      <a class="proto-link" href="#/foundations" data-inspect="chrome.foundations">Foundations</a>
      <a class="proto-link" href="#/sitemap" data-inspect="chrome.sitemap">Sitemap</a>
    </div>
  </div>

  <div class="stage">
    <div class="device-scaler" id="deviceScaler">
      <div class="device" id="device">
        <div class="app app--mobile" id="app">
          <header class="topbar" id="topbar" data-inspect="shell.topbar"></header>
          <div class="app-body">
            <aside class="sidenav" id="sidenav" aria-label="Main navigation" data-inspect="shell.sidenav"></aside>
            <main class="app-main" id="screen" tabindex="-1"></main>
          </div>
          <nav class="tabbar" id="tabbar" aria-label="Main navigation" data-inspect="shell.tabbar"></nav>

          <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

          <!-- Shared modal. It sits inside the app so it stays in the phone frame. -->
          <div class="modal-layer" id="infoModal" hidden>
            <div class="modal-backdrop" data-close-modal aria-hidden="true"></div>
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="infoModalTitle" aria-describedby="infoModalBody">
              <div class="modal__panel">
                <div class="modal__head">
                  <h2 class="section-title" id="infoModalTitle"></h2>
                  <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                      <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"></path>
                    </svg>
                  </button>
                </div>
                <div class="modal__body" id="infoModalBody"></div>
                <div class="modal__actions">
                  <button type="button" class="btn btn--secondary" data-close-modal>Close</button>
                </div>
              </div>
            </div>
          </div>

          <div class="modal-layer" id="createClassModal" hidden>
            <div class="modal-backdrop" data-close-modal aria-hidden="true"></div>
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="createClassTitle" aria-describedby="createClassBody">
              <div class="modal__panel">
                <div class="modal__head">
                  <h2 class="section-title" id="createClassTitle">Create a class</h2>
                  <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                      <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"></path>
                    </svg>
                  </button>
                </div>
                <p class="muted" id="createClassBody" style="margin-top: var(--space-4)">Students join with the class code after you create the class.</p>
                <form class="flow" id="createClassForm" style="margin-top: var(--space-4)">
                  <div class="field">
                    <label class="field__label" for="new-class-name">Class name</label>
                    <input class="input" id="new-class-name" type="text" placeholder="e.g. 12C Computer Science" required>
                  </div>
                  <div class="field">
                    <label class="field__label" for="new-class-subject">Subject</label>
                    <div class="select-wrap">
                      <select class="select" id="new-class-subject">
                        <option value="cs">Computer Science</option>
                        <option value="physics">Physics</option>
                      </select>
                    </div>
                  </div>
                  <p class="field__error" id="newClassError" hidden>Give the class a name first.</p>
                  <div class="modal__actions">
                    <button type="button" class="btn btn--secondary" data-close-modal>Cancel</button>
                    <button type="submit" class="btn btn--primary">Create class</button>
                  </div>
                </form>
              </div>
            </div>
          </div>

          <div class="modal-layer" id="demoModal" hidden>
            <div class="modal-backdrop" data-close-modal aria-hidden="true"></div>
            <div class="modal" role="dialog" aria-modal="true" aria-labelledby="demoModalTitle" aria-describedby="demoModalBody">
              <div class="modal__panel">
                <div class="modal__head">
                  <h2 class="section-title" id="demoModalTitle">Save for later?</h2>
                  <button type="button" class="icon-btn" data-close-modal aria-label="Close dialog">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true">
                      <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"></path>
                    </svg>
                  </button>
                </div>
                <p class="lede" id="demoModalBody" style="margin-top: var(--space-4)">This question will stay in your list so you can come back to it. Nothing is submitted yet.</p>
                <div class="modal__actions">
                  <button type="button" class="btn btn--secondary" data-close-modal>Cancel</button>
                  <button type="button" class="btn btn--primary" data-close-modal>Save question</button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <aside class="inspect-card" id="inspectCard" aria-live="polite" aria-atomic="true" hidden>
    <p class="inspect-card__eyebrow">Inspect</p>
    <h2 class="inspect-card__title" id="inspectTitle"></h2>
    <div class="inspect-card__body" id="inspectBody"></div>
  </aside>

  <script src="src/pseudo.js"></script>
  <script src="src/data.js"></script>
  <script src="src/figures.js"></script>
  <script src="src/ink.js"></script>
  <script src="src/app.js"></script>
</body>
</html>
